name: Cham notebook

# Chạy mọi notebook weekN/*.ipynb đang có trong repo.
#
#  - Ở repo gốc của khoá: chạy không chấm (AUTOGRADE=0), chỉ để bắt lỗi thiếu file, lỗi
#    cú pháp, lỗi import. Bản đẩy lên là bản đề, chưa có lời giải nên chấm nghiêm sẽ đỏ.
#  - Ở repo của học viên (tạo từ template): chạy chấm nghiêm (AUTOGRADE=1), bài sai thì
#    workflow đỏ. Kết quả xem ở tab Actions.
#
# Lời giải kiểm thử của người soạn nằm ở tools/loi_giai_tuan1.py, chạy trên máy người soạn.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  chay-notebook:
    runs-on: ubuntu-latest
    env:
      AUTOGRADE: ${{ github.repository != 'dongthethang2k15kkk/15-weeks-of-military-training' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai dat cong cu
        run: pip install nbclient nbformat ipykernel matplotlib pandas numpy

      - name: Chay cac notebook
        run: |
          shopt -s nullglob
          echo "AUTOGRADE=$AUTOGRADE"
          for nb in week*/*.ipynb; do
            echo "=== Chay $nb ==="
            jupyter nbconvert --to notebook --execute "$nb" \
              --output "/tmp/$(basename "$nb")" \
              --ExecutePreprocessor.timeout=180
          done
